<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>ONE OFF — Miss perfectly.</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f5f7fb;background:#0b0d12;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#283044 0,#11151e 38%,#090b10 75%);color:#f7f8fb}.shell{width:min(100%,480px);min-height:100vh;margin:auto;padding:20px 20px 38px}header{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:-1.5px;font-size:24px}.brand span{color:#b8ff39}.icon-btn,.close{border:0;background:#1a1e28;color:#fff;border-radius:12px;width:42px;height:42px;font-size:21px}.screen{display:none;padding-top:34px}.screen.active{display:block}.eyebrow{color:#b8ff39;font-size:12px;font-weight:900;letter-spacing:2px;margin-bottom:10px}h1{font-size:52px;line-height:.94;letter-spacing:-3px;margin:8px 0 18px}h2{font-size:34px;letter-spacing:-1.5px;margin:10px 0}.lede{color:#aeb5c4;font-size:18px;line-height:1.55}.rule-card{display:flex;gap:18px;align-items:center;background:#151923;border:1px solid #292f3d;border-radius:20px;padding:18px;margin:26px 0}.target-demo{display:grid;place-items:center;min-width:70px;height:70px;border-radius:16px;background:#242a37;font-size:30px;font-weight:950}.rule-card b{color:#b8ff39}.rule-card small{color:#8e96a7;line-height:1.5}.primary,.secondary{width:100%;height:58px;border-radius:17px;font-weight:950;font-size:15px;letter-spacing:.5px;margin-top:12px;cursor:pointer}.primary{border:0;background:#b8ff39;color:#0b0d12;box-shadow:0 10px 30px #b8ff3920}.secondary{border:1px solid #343b4c;background:#171b24;color:#fff}.mini-stats,.result-stats,.modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px;text-align:center}.mini-stats div,.result-stats div,.modal-stats div{padding:14px 4px;background:#12161e;border-radius:14px}.mini-stats b,.result-stats b,.modal-stats b{display:block;font-size:22px}.mini-stats span,.result-stats span,.modal-stats span{font-size:9px;color:#7f8797;font-weight:800;letter-spacing:1px}.progress{display:flex;justify-content:space-between;align-items:center;color:#8d95a5;font-size:11px;font-weight:900;letter-spacing:1.5px}.dots{display:flex;gap:6px}.dot{width:9px;height:9px;border-radius:50%;background:#2a303d}.dot.good{background:#b8ff39}.dot.bad{background:#ff5470}.target-wrap{text-align:center;margin:45px 0 14px}.target-wrap span{display:block;color:#747d8e;font-size:11px;font-weight:900;letter-spacing:2px}.target-wrap strong{display:block;font-size:92px;line-height:1;letter-spacing:-6px}#instruction{text-align:center;color:#aab1bf;min-height:48px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.choice{height:78px;border:1px solid #333a49;border-radius:18px;background:#171b24;color:#fff;font-size:28px;font-weight:900}.choice:active{transform:scale(.98)}.number-input{width:100%;height:86px;border-radius:20px;border:1px solid #343b4b;background:#151923;color:#fff;text-align:center;font-size:38px;font-weight:900;outline:none}.submit{margin-top:12px}.slider-wrap{margin:42px 0 12px}.slider-label{font-size:36px;font-weight:950;text-align:center;margin-bottom:24px}.slider{width:100%;accent-color:#b8ff39}.range-ends{display:flex;justify-content:space-between;color:#697181;font-size:11px}.flash{height:120px;display:grid;place-items:center;font-size:58px;font-weight:950;background:#151923;border-radius:22px;margin-top:24px}.feedback{min-height:64px;margin-top:22px;text-align:center;font-size:20px;font-weight:900}.feedback.good{color:#b8ff39}.feedback.bad{color:#ff6b82}.hidden{display:none!important}.score-ring{width:190px;height:190px;border-radius:50%;border:12px solid #b8ff39;margin:22px auto;display:grid;place-content:center;text-align:center;box-shadow:0 0 50px #b8ff3920}.score-ring b{font-size:43px}.score-ring span{font-size:10px;letter-spacing:2px;color:#8c94a3}.result-grid{display:flex;justify-content:center;gap:8px;margin:20px 0}.result-box{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#ff5470;color:#0b0d12;font-weight:950}.result-box.good{background:#b8ff39}.result-stats{grid-template-columns:1fr 1fr}.modal{position:fixed;inset:0;background:#05070bd9;display:grid;place-items:center;padding:22px;z-index:5}.modal-card{position:relative;width:min(100%,430px);background:#151923;border:1px solid #303746;border-radius:24px;padding:28px}.close{position:absolute;right:18px;top:18px}.modal-stats{margin:28px 0}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:999px;font-weight:800;font-size:13px;z-index:9}@media(max-width:360px){h1{font-size:44px}.target-wrap strong{font-size:78px}}
/* V2 interaction hardening */
a.primary,a.secondary{display:flex;align-items:center;justify-content:center;text-decoration:none}
.choice,.primary,.secondary,.flash,.icon-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.choice:disabled,.primary:disabled{opacity:.58;cursor:default}

</style></head><body><main class="shell"><header><div class="brand">ONE <span>OFF</span></div><a class="icon-btn" href="https://lcsmith2009.github.io/one-off-game/" aria-label="Home">⌂</a></header><section class="screen active" id="game"><div class="progress"><span id="roundText">ROUND 1/5</span><div class="dots" id="dots"></div></div><div id="modeLabel" class="eyebrow"></div><div class="target-wrap"><span>TARGET</span><strong id="target">—</strong></div><p id="instruction"></p><div id="arena"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="primary hidden">NEXT</button></section></main><script>(function(){
var qs=new URLSearchParams(location.search),daily=qs.get('mode')!=='practice',round=0,score=0,results=[],locked=false,timer=null,current=null,KEY='oneoff-v1',started=Date.now(),finishedElapsed=0;
var todayKey=new Date().toLocaleDateString('en-CA'),priorState={};try{priorState=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}var replay=daily&&priorState.dailyScores&&priorState.dailyScores[todayKey]!==undefined,challengeNo=Math.floor((new Date(todayKey+'T00:00:00')-new Date('2026-09-23T00:00:00'))/86400000)+1;var seed=daily?hash(todayKey):(Date.now()>>>0);
function hash(s){var h=2166136261,i;for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rnd(){seed|=0;seed=(seed+0x6D2B79F5)|0;var t=seed;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}
function ri(a,b){return Math.floor(rnd()*(b-a+1))+a}
var modes=['pick','type','slider','flash','pick'];
function make(){return{mode:modes[round],target:ri(12,88)}}
function el(id){return document.getElementById(id)}
function render(){clearInterval(timer);locked=false;current=make();el('roundText').textContent=(daily?(replay?'REPLAY #':'DAILY #')+challengeNo+' • ':'')+'ROUND '+(round+1)+'/5';el('target').textContent=current.target;el('feedback').textContent='';el('feedback').className='feedback';el('nextBtn').classList.add('hidden');el('dots').innerHTML='';for(var d=0;d<5;d++){var x=document.createElement('i');x.className='dot '+(d<results.length?(results[d]?'good':'bad'):'');el('dots').appendChild(x)}el('arena').innerHTML='';var m=current.mode,t=current.target;el('modeLabel').textContent={pick:'PICK ONE',type:'TYPE IT',slider:'SLIDE IT',flash:'QUICK TAP'}[m];
if(m==='pick'){el('instruction').textContent=round===4?'Final round. One perfect miss.':'Choose exactly ONE away.';var sign=rnd()>.5?1:-1,win=t+sign,vals=[win,t,t+(sign*2),t+(sign*3)];shuffle(vals);var box=document.createElement('div');box.className='choice-grid';vals.forEach(function(v){var b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=function(){answer(v)};box.appendChild(b)});el('arena').appendChild(box)}
if(m==='type'){el('instruction').textContent='No choices. Type a number exactly ONE away.';el('arena').innerHTML='<input class="number-input" id="num" inputmode="numeric" placeholder="?"><button class="primary submit" id="submit">LOCK IT</button>';var submitTyped=function(){var n=el('num');if(n.value!=='')answer(Number(n.value))};el('submit').onclick=submitTyped;el('num').onkeydown=function(e){if(e.key==='Enter')submitTyped()}}
if(m==='slider'){el('instruction').textContent='Slide fast. Stop exactly ONE away.';el('arena').innerHTML='<div class="slider-wrap"><div class="slider-label" id="sv">50</div><input id="range" class="slider" type="range" min="1" max="100" value="50"><div class="range-ends"><span>1</span><span>100</span></div></div><button class="primary" id="lock">LOCK IT</button>';var r=el('range');r.oninput=function(){el('sv').textContent=r.value};el('lock').onclick=function(){answer(Number(r.value))}}
if(m==='flash'){el('instruction').textContent='Watch the countdown. Tap the big number when it reaches exactly ONE away.';var sign=rnd()>.5?1:-1,seq=[t+(sign*4),t+(sign*3),t+(sign*2),t+sign,t,t-(sign*2)];el('arena').innerHTML='<button id="flash" class="flash" style="width:100%;border:0;color:white">GET READY</button>';var b=el('flash'),i=0;setTimeout(function(){if(locked)return;b.textContent=seq[0];i=1;timer=setInterval(function(){if(i>=seq.length){clearInterval(timer);if(!locked)answer(seq[seq.length-1]);return}b.textContent=seq[i++]},650)},900);b.onclick=function(){if(b.textContent!=='GET READY')answer(Number(b.textContent))}}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}}
function answer(v){if(locked)return;locked=true;clearInterval(timer);Array.prototype.forEach.call(document.querySelectorAll('#arena button'),function(b){b.disabled=true});var good=Math.abs(v-current.target)===1;results.push(good);if(good)score++;if(navigator.vibrate){try{navigator.vibrate(good?35:[55,45,55])}catch(e){}}var f=el('feedback');f.className='feedback '+(good?'good':'bad');f.textContent=good?'✓ PERFECTLY WRONG':(v===current.target?'✕ TOO ACCURATE!':'✕ OFF BY '+Math.abs(v-current.target));var n=el('nextBtn');n.textContent=round===4?'SEE SCORE':'NEXT';n.classList.remove('hidden')}
el('nextBtn').onclick=function(){if(round<4){round++;render()}else finish()};
function finish(){var elapsed=Math.max(1,Math.round((Date.now()-started)/1000));finishedElapsed=elapsed;var rec=saveRun(elapsed);var blocks=results.map(function(x){return'<div class="result-box '+(x?'good':'')+'">'+(x?'✓':'×')+'</div>'}).join('');el('game').innerHTML='<div class="eyebrow">RUN COMPLETE</div><div class="score-ring"><b>'+score+'/5</b><span>ONE OFF</span></div><h2>'+(score===5?'PERFECTLY WRONG.':score>=3?'NICE MISS.':'TOO ACCURATE.')+'</h2><p>'+(score===5?'You missed every target by exactly one.':'The target is a trap. Miss better next run.')+'</p><div class="result-grid">'+blocks+'</div><div style="text-align:center;color:#8d95a5;font-weight:800;margin:10px 0 18px">'+elapsed+' SEC'+(rec&&rec.newBest?' • NEW PERFECT BEST!':'')+'</div><button id="share" class="primary">SHARE RESULT</button><a class="secondary" href="?mode=practice">PRACTICE AGAIN</a><a class="secondary" href="https://lcsmith2009.github.io/one-off-game/">HOME</a>';el('share').onclick=share}
function saveRun(elapsed){try{var s=JSON.parse(localStorage.getItem(KEY)||'{"runs":0,"best":0,"streak":0,"lastDaily":"","dailyScores":{}}');s.runs=(s.runs||0)+1;s.best=Math.max(s.best||0,score);s.practiceRuns=(s.practiceRuns||0)+(daily?0:1);s.dailyRuns=(s.dailyRuns||0)+(daily?1:0);var old=s.bestPerfectTime||0;s.lastTime=elapsed;if(score===5)s.bestPerfectTime=old?Math.min(old,elapsed):elapsed;if(daily&&!replay){var today=new Date().toLocaleDateString('en-CA');s.dailyScores=s.dailyScores||{};s.dailyScores[today]=score;if(s.lastDaily!==today){var y=new Date();y.setDate(y.getDate()-1);var yd=y.toLocaleDateString('en-CA');s.streak=s.lastDaily===yd?(s.streak||0)+1:1;s.lastDaily=today}}localStorage.setItem(KEY,JSON.stringify(s));return{newBest:score===5&&(!old||elapsed<old),bestPerfectTime:s.bestPerfectTime||0}}catch(e){return null}}
function share(){var secs=finishedElapsed||Math.max(1,Math.round((Date.now()-started)/1000));var text='ONE OFF '+(daily?(replay?'Replay #':'Daily #')+challengeNo:'Practice')+' '+score+'/5 • '+secs+'s\n'+results.map(function(x){return x?'🟩':'🟥'}).join('')+'\n🎯 Miss perfectly.';if(navigator.share){navigator.share({title:'ONE OFF',text:text,url:'https://lcsmith2009.github.io/one-off-game/'}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(text)}}
render();
})();</script></body></html>
